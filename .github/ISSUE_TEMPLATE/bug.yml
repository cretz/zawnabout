name: Something is not right
description: A bug, a glitch, or something that does not work the way it looks like it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Issues are read, though there is no promise every one
        gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what you saw instead of what you expected. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the world
      description: Which island or place, roughly. "On the beach by the lighthouse" is plenty.
  - type: dropdown
    id: how
    attributes:
      label: How you play
      options:
        - In the browser (zawnabout.quest)
        - Desktop download
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Safari on an iPad, Chrome 141 on Windows 11
    validations:
      required: true
