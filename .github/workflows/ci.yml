name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: projects

jobs:
  # Formatting and lints once, for native and the web build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo clippy --release --target wasm32-unknown-unknown -p zawnabout-web -- -D warnings

  # Tests and every playbook on each platform. CI machines have no GPU, so wgpu falls back
  # to a software one: lavapipe on Linux, WARP on Windows, the runner's virtual GPU on macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects
      - run: cargo build --release
      - run: cargo test --release
      - name: Playbooks
        run: zawnabout-playbooks/run-all.sh "$RUNNER_TEMP/playbooks"
      - name: Playbook logs and shots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playbooks-${{ matrix.os }}
          path: ${{ runner.temp }}/playbooks
